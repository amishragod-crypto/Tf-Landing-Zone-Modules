name: Terraform CI-CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "environments/dev"

# ============================================================
# STAGE 1 - TERRAFORM SCAN
# ============================================================

jobs:

  terraform-scan:

    name: Terraform Scan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false


 # =========================================================
      # 1. TFLINT
      # =========================================================

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Run TFLint
        run: |
          tflint --init
          tflint


      # =========================================================
      # 2. CHECKOV
      # =========================================================

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          quiet: false
          soft_fail: true


      # =========================================================
      # 3. TRIVY
      # =========================================================

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ${{ env.TF_WORKING_DIR }}
          format: table
          exit-code: 0


      # =========================================================
      # 4. TERRASCAN
      # =========================================================

      # - name: Install Terrascan
      #   run: |
      #     curl -L "$(curl -s https://api.github.com/repos/tenable/terrascan/releases/latest \
      #     | grep -o 'https://[^"]*Linux_x86_64.tar.gz' | head -1)" \
      #     -o terrascan.tar.gz

      #     tar -xzf terrascan.tar.gz
      #     sudo mv terrascan /usr/local/bin/


      # - name: Run Terrascan
      #   run: |
      #     terrascan scan \
      #       -i terraform \
      #       -d .

      # =========================================================
      # 5. GITLEAKS
      # =========================================================

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # 6. INFRACOST
      # =========================================================

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}


      - name: Run Infracost
        run: |
          infracost breakdown \
            --path . \
            --format table


      # =========================================================
      # Scan Completed
      # =========================================================

      - name: Scan Summary
        run: |
          echo "======================================"
          echo "Terraform Scan Completed"
          echo "======================================"
          echo "1. TFLint"
          echo "2. Checkov"
          echo "3. Trivy"
          echo "4. Terrascan"
          echo "5. Gitleaks"
          echo "6. Infracost"
          echo "======================================"

# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

  terraform-plan:

    name: Terraform Plan

    needs: terraform-scan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        run: |
          az login --service-principal \
            -u "${{ secrets.AZURE_CLIENT_ID }}" \
            -p "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false


      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan


      # --------------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan


# ============================================================
# STAGE 3 - MANUAL APPROVAL
# ============================================================

